<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101922">
  <title>Hot Ticket</title>
  <link rel="icon" href="./icons/ticket.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <main id="content" class="content" aria-live="polite">
      <div class="screen-loader" aria-label="Загрузка">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" type="button" data-view="deals">
        <span class="icon icon-flame" aria-hidden="true"></span><span>Deals</span>
      </button>
      <button class="nav-item" type="button" data-view="watchlist">
        <span class="nav-icon-wrap"><span class="icon icon-bell" aria-hidden="true"></span><span id="watch-dot" class="watch-dot hidden"></span></span>
        <span>Watchlist</span>
      </button>
      <button class="nav-item" type="button" data-view="profile">
        <span class="icon icon-user" aria-hidden="true"></span><span>Профиль</span>
      </button>
    </nav>

    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
    <section id="filter-sheet" class="bottom-sheet hidden" aria-modal="true" aria-labelledby="filter-title"></section>
    <div id="toast" class="toast hidden" role="status"></div>
  </div>
</body>
</html>
